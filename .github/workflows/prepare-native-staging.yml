name: Preparar correção da renderização (2.0.10)
on:
  push:
    branches: [fix/precreate-native-controls-2010]
    paths: ['.github/workflows/prepare-native-staging.yml']
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção isolada sobre a 2.0.9
        run: |
          python3 tools/prepare-native-staging.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PaoCaixa-2.0.10-Source.zip
          git rm .github/workflows/prepare-native-staging.yml
          git commit -m "fix: corrigir renderização incompleta em WinForms 2.0.10"
          git push
