name: Inspecionar transicao de paineis
on:
  push:
    branches: [fix/ui-flicker-20261024]
    paths: ['.github/workflows/inspect-ui.yml', 'tools/prepare-ui-flicker-fix.py']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examinar codigo de navegacao
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('PaoCaixa-2.0.5-Source.zip') as z:
              names=[n for n in z.namelist() if n.endswith('.cs') and '/src/' in '/'+n]
              print('FONTES:', '\n'.join(names))
              terms=['Controls.Clear(', 'SuspendLayout(', 'ResumeLayout(', 'SetStyle(', 'DoubleBuffered', 'BringToFront(', 'Controls.Add(', 'Controls.Remove(', 'SwitchPage', 'ShowPage', 'Navigate', 'RenderPage', 'RenderView', 'SelectPage', 'OpenPage', 'SetPage', 'ApplyTheme', 'Invalidate(', 'Refresh(']
              for n in names:
                  lines=z.read(n).decode('utf-8-sig').splitlines()
                  if n.endswith('MainForm.cs'):
                      for k in [15,17,18,20,75,76,77,78,79,80,81,82,83,187,188,189,190]:
                          if k < len(lines): print('FULL-MAIN',k+1,lines[k])
                  hits=[i for i,l in enumerate(lines) if any(t.lower() in l.lower() for t in terms)]
                  print('\n###',n,'total',len(lines),'hits',len(hits))
                  seen=set()
                  for i in hits[:55]:
                      a,b=max(0,i-8),min(len(lines),i+12)
                      for j in range(a,b):
                          if j not in seen:
                              print('%04d: %s'%(j+1,lines[j][:190]))
                              seen.add(j)
                      print('---')
          PY

      - name: Preparar ZIP corrigido para validacao
        shell: bash
        run: |
          python3 tools/prepare-ui-flicker-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PaoCaixa-2.0.6-Source.zip
          git commit -m "fix: eliminar repintura intermediaria entre paineis (2.0.6)"
          git push
