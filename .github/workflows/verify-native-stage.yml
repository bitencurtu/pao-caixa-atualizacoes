name: Confirmar HWND antes de mostrar painéis
on:
  push:
    branches: [fix/precreate-native-controls-2010]
    paths: ['.github/workflows/verify-native-stage.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Criar diagnóstico sobre a 2.0.10 sem alterar fontes públicas
        shell: pwsh
        run: |
          git fetch --depth=1 origin diagnostics/flicker-root-cause-20261024
          git show FETCH_HEAD:tools/UiFlickerDiag.cs | Out-File -FilePath UiFlickerDiag.cs -Encoding utf8
          Expand-Archive PaoCaixa-2.0.10-Source.zip -DestinationPath diagnostic -Force
          @'
          import pathlib
          p=pathlib.Path("diagnostic/pao-caixa-nativo/src/MainForm.cs")
          s=p.read_text(encoding="utf-8-sig")
          marker="  void SwapPage(Panel previous,Panel next){"
          helper="""  static int NativeCount(Control c){
           int n=c.IsHandleCreated?1:0;
           foreach(Control child in c.Controls)n+=NativeCount(child);
           return n;
          }
          """
          assert s.count(marker)==1
          s=s.replace(marker,helper+marker)
          marker="    CreatePageHandles(next);"
          assert s.count(marker)==1
          s=s.replace(marker,marker+"""
             int before=NativeCount(next);
             Console.WriteLine("STAGE_NATIVE;"+page+";BEFORE_SWAP="+before+";HANDLE="+next.IsHandleCreated);
             if(before<1||!next.IsHandleCreated)throw new Exception("Arvore nativa nao foi criada durante preparacao");
          """)
          marker="   previous.Dispose();\n  }\n  async void LoadPage(){"
          assert s.count(marker)==1
          s=s.replace(marker, """   previous.Dispose();
             Console.WriteLine("STAGE_NATIVE;"+page+";AFTER_SWAP="+NativeCount(next)+";HANDLE="+next.IsHandleCreated);
          }
          async void LoadPage(){""")
          p.write_text(s,encoding="utf-8-sig")
          '@ | python -
          Set-Location diagnostic/pao-caixa-nativo
          New-Item -ItemType Directory build -Force | Out-Null
          Copy-Item vendor/sqlite/sqlite3.dll build/sqlite3.dll -Force
          node tests/create-legacy-fixture.mjs build/fixture
          if($LASTEXITCODE -ne 0){throw 'Fixture failed'}
      - name: Abrir quatro páginas repetidamente no Windows
        shell: pwsh
        run: |
          Set-Location diagnostic/pao-caixa-nativo
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          $project=(Get-Location).Path
          $sources=@(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          $probe=(Resolve-Path '../../UiFlickerDiag.cs').Path
          & $csc '/nologo' '/langversion:5' '/codepage:65001' '/target:exe' '/platform:x86' '/optimize+' '/main:UiDiag' '/reference:System.Windows.Forms.dll' '/reference:System.Drawing.dll' '/reference:System.Web.Extensions.dll' '/reference:System.Core.dll' "/resource:$(Join-Path $project 'resources/seed.json'),seed.json" "/resource:$(Join-Path $project 'resources/owner-bootstrap.json'),owner-bootstrap.json" "/resource:$(Join-Path $project 'resources/icon.ico'),icon.ico" '/out:build/UiDiag.exe' @sources $probe
          if($LASTEXITCODE -ne 0){throw 'Compilation failed'}
          & ./build/UiDiag.exe build/fixture
          if($LASTEXITCODE -ne 0){throw 'Panel staging failed'}
