name: Medir navegação 2.0.11 vs correção
on:
  push:
    branches: [perf/profile-navigation-2012]
    paths: ['.github/workflows/nav-compare.yml', 'tools/NavLatencyTests.cs', '_nav2012/pao-caixa-nativo/src/MainForm.cs']
permissions:
  contents: read
jobs:
  bench:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extrair versões e preparar fixture
        shell: pwsh
        run: |
          Expand-Archive PaoCaixa-2.0.11-Source.zip -DestinationPath baseline -Force
          New-Item -ItemType Directory -Path 'baseline/pao-caixa-nativo/build' -Force | Out-Null
          Copy-Item baseline/pao-caixa-nativo/vendor/sqlite/sqlite3.dll baseline/pao-caixa-nativo/build/sqlite3.dll -Force
          Push-Location baseline/pao-caixa-nativo
          node tests/create-legacy-fixture.mjs build/nav-fixture
          if($LASTEXITCODE -ne 0){throw 'Falha no fixture'}
          Pop-Location
          New-Item -ItemType Directory -Path optimized -Force | Out-Null
          Copy-Item -Recurse baseline/pao-caixa-nativo optimized/pao-caixa-nativo
          Copy-Item _nav2012/pao-caixa-nativo/src/MainForm.cs optimized/pao-caixa-nativo/src/MainForm.cs -Force
          Copy-Item -Recurse baseline/pao-caixa-nativo/build/nav-fixture optimized/pao-caixa-nativo/build/nav-fixture
      - name: Medir versão atual 2.0.11
        shell: pwsh
        run: |
          Set-Location baseline/pao-caixa-nativo
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          $project=(Get-Location).Path
          $sources=@(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          $harness=(Resolve-Path '../../tools/NavLatencyTests.cs').Path
          & $csc '/nologo' '/langversion:5' '/codepage:65001' '/target:exe' '/platform:x86' '/optimize+' '/main:NavigationLatencyTests' '/reference:System.Windows.Forms.dll' '/reference:System.Drawing.dll' '/reference:System.Web.Extensions.dll' '/reference:System.Core.dll' "/resource:$(Join-Path $project 'resources/seed.json'),seed.json" "/resource:$(Join-Path $project 'resources/owner-bootstrap.json'),owner-bootstrap.json" "/resource:$(Join-Path $project 'resources/icon.ico'),icon.ico" '/out:build/NavLatency.exe' @sources $harness
          if($LASTEXITCODE -ne 0){throw 'Compile baseline'}
          & ./build/NavLatency.exe build/nav-fixture
          if($LASTEXITCODE -ne 0){throw 'Teste baseline falhou'}
      - name: Medir otimização e tempos por fase
        shell: pwsh
        env:
          PAOCAIXA_PROFILE_UI: '1'
        run: |
          Set-Location optimized/pao-caixa-nativo
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          $project=(Get-Location).Path
          $sources=@(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          $harness=(Resolve-Path '../../tools/NavLatencyTests.cs').Path
          & $csc '/nologo' '/langversion:5' '/codepage:65001' '/target:exe' '/platform:x86' '/optimize+' '/main:NavigationLatencyTests' '/reference:System.Windows.Forms.dll' '/reference:System.Drawing.dll' '/reference:System.Web.Extensions.dll' '/reference:System.Core.dll' "/resource:$(Join-Path $project 'resources/seed.json'),seed.json" "/resource:$(Join-Path $project 'resources/owner-bootstrap.json'),owner-bootstrap.json" "/resource:$(Join-Path $project 'resources/icon.ico'),icon.ico" '/out:build/NavLatency.exe' @sources $harness
          if($LASTEXITCODE -ne 0){throw 'Compile optimized'}
          & ./build/NavLatency.exe build/nav-fixture
          if($LASTEXITCODE -ne 0){throw 'Teste otimizado falhou'}
