name: Empacotar correcao de paineis 2.0.8
on:
  push:
    branches: [fix/navigation-no-flicker-208]
    paths: ['.github/workflows/package-208.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar projeto atualizado sem alterar historico
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,os,pathlib
          previous=pathlib.Path('PaoCaixa-2.0.7-Source.zip')
          new=pathlib.Path('PaoCaixa-2.0.8-Source.zip')
          updates={}
          for name in ('MainForm.cs','SettingsPage.cs'):
           p=pathlib.Path('_workbench/pao-caixa-nativo/src')/name
           assert p.exists(), p
           updates['pao-caixa-nativo/src/'+name]=p.read_bytes()
          replaced=set()
          with zipfile.ZipFile(previous) as src,zipfile.ZipFile(new,'w') as dest:
           for info in src.infolist():
            path=info.filename
            raw=src.read(path)
            if path in updates:
             raw=updates[path];replaced.add(path)
            if path.endswith(('.cs','.json','.nsi','.config','.md','.xml','.mjs','.txt')):
             raw=raw.replace(b'2.0.7',b'2.0.8')
            dest.writestr(info,raw)
          assert replaced==set(updates),replaced
          with zipfile.ZipFile(new) as z:
           assert b'2.0.8' in z.read('pao-caixa-nativo/version.json')
           assert b'!define VERSION "2.0.8"' in z.read('pao-caixa-nativo/installer.nsi')
           assert b'public const string Version="2.0.8"' in z.read('pao-caixa-nativo/src/Updates.cs')
           a=z.read('pao-caixa-nativo/src/MainForm.cs')
           b=z.read('pao-caixa-nativo/src/SettingsPage.cs')
           assert b'void SwapPage(Panel previous,Panel next)' in a
           assert b'async void RunFullUpdate()' in a
           assert b'Verificar e atualizar' in b and b'Baixar atualiza' not in b
          print('Preparada versao',new,new.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PaoCaixa-2.0.8-Source.zip
          git rm -qr _workbench .github/workflows/working-copy.yml .github/workflows/package-208.yml
          git commit -m "fix: publicar fontes 2.0.8 com troca atomica de paineis e atualizacao unica"
          git push
