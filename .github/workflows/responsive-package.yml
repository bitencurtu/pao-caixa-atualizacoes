name: Validar responsividade e montar 2.0.16
on:
  push:
    branches: [fix/responsive-monitors-2016]
    paths: ['.github/workflows/responsive-package.yml', '_responsive/pao-caixa-nativo/src/*.cs']
permissions:
  contents: write
jobs:
  responsive:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fontes e ambiente do Windows
        shell: pwsh
        run: |
          Expand-Archive PaoCaixa-2.0.15-Source.zip -DestinationPath source -Force
          $names=@('MainForm.cs','Sections.cs','PresentationPages.cs','SettingsPage.cs','VisualControls.cs')
          foreach($n in $names){
           Copy-Item "_responsive/pao-caixa-nativo/src/$n" "source/pao-caixa-nativo/src/$n" -Force
          }
          Set-Location source/pao-caixa-nativo
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Copy-Item vendor/sqlite/sqlite3.dll build/sqlite3.dll -Force
      - name: Testar medidas, menu, barra e painéis em resoluções variadas
        shell: pwsh
        run: |
          Set-Location source/pao-caixa-nativo
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          $project=(Get-Location).Path
          $files=@(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          $test=(Resolve-Path '../../tools/ResponsiveScreenTests-2016.cs').Path
          & $csc '/nologo' '/langversion:5' '/codepage:65001' '/target:exe' '/platform:x86' '/optimize+' '/main:ResponsiveScreenTests' '/reference:System.Windows.Forms.dll' '/reference:System.Drawing.dll' '/reference:System.Web.Extensions.dll' '/reference:System.Core.dll' "/resource:$(Join-Path $project 'resources/seed.json'),seed.json" "/resource:$(Join-Path $project 'resources/owner-bootstrap.json'),owner-bootstrap.json" "/resource:$(Join-Path $project 'resources/icon.ico'),icon.ico" '/out:build/ResponsiveScreenTests.exe' @files $test
          if($LASTEXITCODE -ne 0){throw 'Failed to compile responsive tests'}
          & ./build/ResponsiveScreenTests.exe build
          if($LASTEXITCODE -ne 0){throw 'Responsive UI test failed'}
      - name: Gerar fonte 2.0.16 sem alterar outras funções
        shell: pwsh
        run: |
          @'
          import pathlib,zipfile
          old=pathlib.Path('PaoCaixa-2.0.15-Source.zip')
          new=pathlib.Path('PaoCaixa-2.0.16-Source.zip')
          targets={'pao-caixa-nativo/src/'+n:(pathlib.Path('_responsive/pao-caixa-nativo/src')/n).read_bytes() for n in ('MainForm.cs','Sections.cs','PresentationPages.cs','SettingsPage.cs','VisualControls.cs')}
          used=set()
          with zipfile.ZipFile(old) as inp,zipfile.ZipFile(new,'w') as out:
           for info in inp.infolist():
            data=inp.read(info.filename)
            if info.filename in targets:
             data=targets[info.filename];used.add(info.filename)
            if info.filename.endswith(('.cs','.json','.nsi','.config','.md','.xml','.mjs','.txt')):
             data=data.replace(b'2.0.15',b'2.0.16')
            out.writestr(info,data)
          assert used==set(targets), (used,targets.keys())
          with zipfile.ZipFile(new) as z:
           assert b'ResponsiveLayout' in z.read('pao-caixa-nativo/src/Sections.cs')
           assert b'ClientSizeChanged+=' in z.read('pao-caixa-nativo/src/MainForm.cs')
           assert b'public const string Version="2.0.16"' in z.read('pao-caixa-nativo/src/Updates.cs')
           assert b'!define VERSION "2.0.16"' in z.read('pao-caixa-nativo/installer.nsi')
          print('RESPONSIVE_PACKAGE_READY',new,new.stat().st_size)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Packaging failed'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PaoCaixa-2.0.16-Source.zip
          git rm -r _responsive .github/workflows/responsive-extract.yml .github/workflows/responsive-package.yml tools/ResponsiveScreenTests-2016.cs
          git commit -m "fix: layout adaptativo para monitores pequenos e grandes"
          git push
