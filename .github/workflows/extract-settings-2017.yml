name: Preparar ajuste Configurações 2.0.17
on:
  push:
    branches: [fix/remove-default-operator-2017]
    paths: ['.github/workflows/extract-settings-2017.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair código relevante de 2.0.16
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('PaoCaixa-2.0.16-Source.zip') as z:
           for name in ('src/SettingsPage.cs','src/Models.cs','src/MainForm.cs','tests/VisualBehaviorTests.cs'):
            entry='pao-caixa-nativo/'+name
            target=pathlib.Path('_settings2017')/entry
            target.parent.mkdir(parents=True,exist_ok=True)
            b=z.read(entry)
            target.write_bytes(b)
            print('EXTRACT',entry,len(b))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _settings2017
          git commit -m 'chore: prepare settings source from 2.0.16'
          git push
