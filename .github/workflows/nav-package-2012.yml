name: Preparar PaoCaixa 2.0.12
on:
  push:
    branches: [perf/profile-navigation-2012]
    paths: ['.github/workflows/nav-package-2012.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar fonte final otimizada
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          old=pathlib.Path('PaoCaixa-2.0.11-Source.zip')
          new=pathlib.Path('PaoCaixa-2.0.12-Source.zip')
          changed=pathlib.Path('_nav2012/pao-caixa-nativo/src/MainForm.cs').read_bytes()
          found=0
          with zipfile.ZipFile(old) as src,zipfile.ZipFile(new,'w') as target:
           for info in src.infolist():
            data=src.read(info.filename)
            if info.filename=='pao-caixa-nativo/src/MainForm.cs':
             data=changed
             found+=1
            if info.filename.endswith(('.cs','.json','.nsi','.config','.md','.xml','.mjs','.txt')):
             data=data.replace(b'2.0.11',b'2.0.12')
            target.writestr(info,data)
          assert found==1,found
          with zipfile.ZipFile(new) as z:
           source=z.read('pao-caixa-nativo/src/MainForm.cs')
           assert b'lastSavedDraftJson' in source
           assert b'PAOCAIXA_PROFILE_UI' in source
           assert b'bool silentUi=false' in source
           assert b'CreatePageHandles(next);' in source
           assert b'public const string Version="2.0.12"' in z.read('pao-caixa-nativo/src/Updates.cs')
           assert b'!define VERSION "2.0.12"' in z.read('pao-caixa-nativo/installer.nsi')
          print('Pacote:',new,new.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PaoCaixa-2.0.12-Source.zip
          git rm -qr _nav2012 .github/workflows/nav-source-extract.yml .github/workflows/nav-compare.yml .github/workflows/nav-package-2012.yml tools/NavLatencyTests.cs
          git commit -m 'perf: evitar saves repetitivos e piscadas no menu; instrumentacao opcional'
          git push
