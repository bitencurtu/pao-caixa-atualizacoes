name: Medir memória do Pão e Caixa
on:
  push:
    branches: [perf/memory-baseline-209]
    paths: ['.github/workflows/perf-bench.yml', 'tools/MemoryBench.cs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar versão 2.0.8 sem modificações
        shell: pwsh
        run: |
          Expand-Archive 'PaoCaixa-2.0.8-Source.zip' -DestinationPath baseline -Force
          Set-Location baseline/pao-caixa-nativo
          New-Item -ItemType Directory build -Force | Out-Null
          Copy-Item vendor/sqlite/sqlite3.dll build/sqlite3.dll -Force
          node tests/create-legacy-fixture.mjs build/memory-fixture
          if ($LASTEXITCODE -ne 0) { throw "Fixture de memória falhou." }
      - name: Compilar benchmark com fontes reais
        shell: pwsh
        run: |
          Set-Location baseline/pao-caixa-nativo
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          $project = (Get-Location).Path
          $sources = @(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          & $csc '/nologo' '/langversion:5' '/codepage:65001' '/target:exe' '/platform:x86' '/optimize+' '/main:MemoryBench' '/reference:System.Windows.Forms.dll' '/reference:System.Drawing.dll' '/reference:System.Web.Extensions.dll' '/reference:System.Core.dll' "/resource:$(Join-Path $project 'resources/seed.json'),seed.json" "/resource:$(Join-Path $project 'resources/owner-bootstrap.json'),owner-bootstrap.json" "/resource:$(Join-Path $project 'resources/icon.ico'),icon.ico" '/out:build/MemoryBench.exe' @sources '../../tools/MemoryBench.cs'
          if($LASTEXITCODE -ne 0) { throw 'Falha ao compilar benchmark.' }
      - name: Medir baseline Windows
        shell: pwsh
        run: |
          Set-Location baseline/pao-caixa-nativo
          & ./build/MemoryBench.exe build/memory-fixture
          if($LASTEXITCODE -ne 0) { throw 'Benchmark de memória falhou.' }
