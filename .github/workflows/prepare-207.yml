name: Preparar a correcao visual 2.0.7
on:
  push:
    branches: [fix/ui-flicker-20261024]
    paths: ['.github/workflows/prepare-207.yml']
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase dos arquivos fonte e gerar ZIP corrigido
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- PaoCaixa-2.0.6-Source.zip
          python3 tools/prepare-ui-flicker-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PaoCaixa-2.0.6-Source.zip PaoCaixa-2.0.7-Source.zip
          git commit -m "fix: nova versao 2.0.7 com transicoes sem flicker"
          git push
