name: Check photo sources for catalog
on:
  push:
    branches: [feat/catalog-photos-2019]
    paths: ['.github/workflows/catalog-photo-probe-2019.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Wikimedia Commons search and thumbnails
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,json
          for q in ['Pão de queijo','orange juice glass','Brigadeiro']:
           url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','generator':'search','gsrsearch':q,'gsrnamespace':6,'gsrlimit':4,'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':200})
           r=urllib.request.Request(url,headers={'User-Agent':'PaoCaixaProductCatalog/1.0 (open-source photo attribution; github.com/bitencurtu/pao-caixa-atualizacoes)'})
           with urllib.request.urlopen(r,timeout=18) as response:data=json.load(response)
           print('QUERY',q)
           for item in sorted(data.get('query',{}).get('pages',{}).values(),key=lambda x:x.get('index',99)):
            im=item.get('imageinfo',[{}])[0]
            print(item.get('title'),im.get('thumburl','')[:110],list(im.get('extmetadata',{}).keys())[:5])
          PY
