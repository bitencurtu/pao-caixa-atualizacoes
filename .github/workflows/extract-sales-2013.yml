name: Preparar análise Histórico de vendas 2.0.12
on:
  push:
    branches: [fix/sales-history-flicker-2013]
    paths: ['.github/workflows/extract-sales-2013.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair controles e histórico para investigação
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          names=['src/MainForm.cs','src/Ui.cs','src/PresentationPages.cs','src/SettingsPage.cs','src/VisualControls.cs','src/SmoothScrolling.cs','src/CanvasView.cs','tests/VisualBehaviorTests.cs','tests/IntegrationTests.cs']
          with zipfile.ZipFile('PaoCaixa-2.0.12-Source.zip') as z:
           for n in names:
            path=pathlib.Path('_sales2013/pao-caixa-nativo')/n
            path.parent.mkdir(parents=True,exist_ok=True)
            b=z.read('pao-caixa-nativo/'+n)
            path.write_bytes(b)
            print('EXTRACTED',n,len(b))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _sales2013
          git commit -m "chore: extrair fontes para revisão de histórico de vendas"
          git push
