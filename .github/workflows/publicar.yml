name: Compilar e publicar PaoCaixa

on:
  push:
    branches: [main]
    paths:
      - 'PaoCaixa-*-Source.zip'
      - '.github/workflows/publicar.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PaoCaixa-*-Source.zip'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Nome do ZIP de codigo-fonte (opcional)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: paocaixa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-2022
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Selecionar codigo-fonte
        id: source
        shell: pwsh
        env:
          NOME_SOLICITADO: ${{ inputs.arquivo }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '^PaoCaixa-(\d+\.\d+\.\d+)-Source\.zip$'
          $files = @(Get-ChildItem -File -Filter 'PaoCaixa-*-Source.zip' | Where-Object { $_.Name -match $pattern })
          if ($files.Count -eq 0) { throw 'Envie um arquivo PaoCaixa-2.0.3-Source.zip para a raiz do repositorio.' }
          if ($env:NOME_SOLICITADO) {
            $file = $files | Where-Object Name -eq $env:NOME_SOLICITADO | Select-Object -First 1
            if (-not $file) { throw 'ZIP solicitado nao existe no repositorio.' }
          } else {
            $changed = @(git diff-tree --no-commit-id --name-only -r HEAD)
            $candidates = @($files | Where-Object { $changed -contains $_.Name })
            if ($candidates.Count -eq 0) { $candidates = $files }
            $file = $candidates | Sort-Object { [version]([regex]::Match($_.Name, $pattern).Groups[1].Value) } -Descending | Select-Object -First 1
          }
          if ($file.Name -notmatch $pattern) { throw 'Nome do ZIP invalido.' }
          $version = $Matches[1]
          "arquivo=$($file.Name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Compilando PaoCaixa $version a partir de $($file.Name)"

      - name: Extrair e validar codigo
        shell: pwsh
        env:
          ZIP_FONTE: ${{ steps.source.outputs.arquivo }}
          VERSAO: ${{ steps.source.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath $env:ZIP_FONTE -DestinationPath source -Force
          $project = 'source/pao-caixa-nativo'
          if (-not (Test-Path "$project/version.json")) { throw 'O ZIP deve conter pao-caixa-nativo/version.json.' }
          $meta = Get-Content "$project/version.json" -Raw | ConvertFrom-Json
          if ($meta.version -ne $env:VERSAO) { throw "Versao no ZIP $($meta.version) difere de $env:VERSAO." }
          $installer = Get-Content "$project/installer.nsi" -Raw
          if (-not $installer.Contains('!define VERSION "' + $env:VERSAO + '"')) { throw 'installer.nsi com versao incorreta.' }
          $source = Get-Content "$project/src/Updates.cs" -Raw
          if (-not $source.Contains('public const string Version="' + $env:VERSAO + '"')) { throw 'Updates.cs com versao incorreta.' }
          Push-Location $project
          try {
            & node scripts/check-remote-config.mjs
            if ($LASTEXITCODE -ne 0) { throw 'URL do Cloudflare Worker nao configurada.' }
          } finally { Pop-Location }

      - name: Instalar NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar NSIS.' }

      - name: Compilar e verificar EXE no Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'source/pao-caixa-nativo'
          $project = (Get-Location).Path
          New-Item -ItemType Directory -Path 'build','release' -Force | Out-Null
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          if (-not (Test-Path $csc)) { throw 'Compilador C# do .NET Framework nao encontrado.' }
          $exe = Join-Path $project 'build/PaoCaixa.exe'
          $sourceFiles = @(Get-ChildItem -LiteralPath (Join-Path $project 'src') -Filter '*.cs' -File | ForEach-Object { $_.FullName })
          if ($sourceFiles.Count -lt 5) { throw 'Arquivos C# nao encontrados no projeto.' }
          $compileArgs = @(
            '/nologo', '/langversion:5', '/codepage:65001', '/target:winexe', '/platform:x86', '/optimize+',
            "/out:$exe", '/reference:System.Windows.Forms.dll', '/reference:System.Drawing.dll',
            '/reference:System.Web.Extensions.dll', '/reference:System.Core.dll',
            "/resource:$(Join-Path $project 'resources/seed.json'),seed.json",
            "/resource:$(Join-Path $project 'resources/catalog-extras.json'),catalog-extras.json",
            "/resource:$(Join-Path $project 'resources/catalog-photos.jpg'),catalog-photos.jpg",
            "/resource:$(Join-Path $project 'resources/owner-bootstrap.json'),owner-bootstrap.json",
            "/resource:$(Join-Path $project 'resources/icon.ico'),icon.ico",
            "/win32manifest:$(Join-Path $project 'resources/app.manifest')",
            "/win32icon:$(Join-Path $project 'resources/icon.ico')"
          )
          Write-Host "Compilando $($sourceFiles.Count) arquivos C# em: $exe"
          & $csc @compileArgs @sourceFiles
          if ($LASTEXITCODE -ne 0) { throw "Compilacao C# falhou (codigo $LASTEXITCODE)." }
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Get-ChildItem -Force -Path (Join-Path $project 'build') | Format-Table Name,Length
            throw "Compilador terminou, mas o executavel nao foi criado: $exe"
          }
          Write-Host "EXE compilado: $((Get-Item -LiteralPath $exe).Length) bytes"
          Copy-Item -LiteralPath 'resources/PaoCaixa.exe.config' -Destination 'build/PaoCaixa.exe.config' -Force

      - name: Gerar instalador NSIS
        shell: pwsh
        env:
          VERSAO: ${{ steps.source.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'source/pao-caixa-nativo'
          $project = (Get-Location).Path
          $nsis32 = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          $nsis64 = Join-Path $env:ProgramFiles 'NSIS/makensis.exe'
          $nsis = @($nsis32,$nsis64) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'makensis.exe nao encontrado.' }
          # NSIS no Windows exige caminhos Windows com barras invertidas.
          # As versoes anteriores convertiam para / e NSIS nao encontrava o EXE.
          $script = Get-Content 'installer.nsi' -Raw
          $arquivos = @(
            'build\PaoCaixa.exe',
            'resources\PaoCaixa.exe.config',
            'resources\remote-control.json',
            'vendor\sqlite\sqlite3.dll',
            'GUIA-PaoCaixa-Windows.md',
            'resources\icon.ico'
          )
          foreach ($relativo in $arquivos) {
            $origem = Join-Path $project $relativo
            if (-not (Test-Path -LiteralPath $origem -PathType Leaf)) {
              throw "Arquivo obrigatorio ausente antes do NSIS: $origem"
            }
            $caminhoNSIS = [System.IO.Path]::GetFullPath($origem)
            # O projeto original usa / nas strings File e !define MUI_ICON.
            $referencia = $relativo.Replace('\','/')
            $script = $script.Replace('"' + $referencia + '"', '"' + $caminhoNSIS + '"')
            Write-Host "NSIS: $referencia -> $caminhoNSIS"
          }
          $installerName = "PaoCaixa-Instalador-$env:VERSAO-x86.exe"
          $out = Join-Path $project "release\$installerName"
          $script = $script.Replace('"release/PaoCaixa-Instalador-${VERSION}-x86.exe"','"' + $out + '"')
          if ($script -match 'File "build/PaoCaixa.exe"') {
            throw 'Caminho antigo do PaoCaixa.exe ainda presente no NSIS.'
          }
          Set-Content -LiteralPath 'installer-ci.nsi' -Value $script -Encoding utf8BOM
          & $nsis '/INPUTCHARSET' 'UTF8' 'installer-ci.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar instalador NSIS.' }
          if (-not (Test-Path "release/$installerName")) { throw 'Instalador nao foi criado.' }
          Write-Host "Instalador criado: release/$installerName"

      - name: Gerar manifesto de atualização compatível com 2.0.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'source/pao-caixa-nativo'
          & node scripts/release-feed.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar manifesto LF e hashes.' }

      - name: Testar núcleo, atualização e integração no Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'source/pao-caixa-nativo'
          $project = (Get-Location).Path
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          $sources = @(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          Copy-Item vendor/sqlite/sqlite3.dll build/sqlite3.dll -Force
          & node tests/RemoteServerTests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Testes do Worker falharam.' }
          & node tests/create-legacy-fixture.mjs build/core-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture antiga falhou.' }
          $common = @('/nologo','/langversion:5','/codepage:65001','/target:exe','/platform:x86',
            '/reference:System.Windows.Forms.dll','/reference:System.Drawing.dll',
            '/reference:System.Web.Extensions.dll','/reference:System.Core.dll',
            "/resource:$(Join-Path $project 'resources\seed.json'),seed.json",
            "/resource:$(Join-Path $project 'resources\catalog-extras.json'),catalog-extras.json",
            "/resource:$(Join-Path $project 'resources\catalog-photos.jpg'),catalog-photos.jpg",
            "/resource:$(Join-Path $project 'resources\owner-bootstrap.json'),owner-bootstrap.json")
          foreach ($test in @('CoreTests','UpdateTests','RemotePolicyTests','IntegrationTests','VisualBehaviorTests','CatalogPhotoTests')) {
            $testExe = Join-Path $project "build\$test.exe"
            $testSource = Join-Path $project "tests\$test.cs"
            $legacySource = Join-Path $project 'tests\legacy\Updates-2.0.3.cs'
            & $csc @common "/out:$testExe" "/main:$test" @sources $testSource $legacySource
            if ($LASTEXITCODE -ne 0) { throw "Compilacao de $test falhou." }
          }
          & ./build/CoreTests.exe build/core-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Regressao no núcleo de vendas/caixa/contas.' }
          & ./build/UpdateTests.exe build/update-fixture tests/fixtures/latest-2.0.3-crlf.yml
          if ($LASTEXITCODE -ne 0) { throw 'Testes de atualizacao falharam.' }
          & ./build/RemotePolicyTests.exe build/remote-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Politica de bloqueio/offline falhou.' }
          & ./build/VisualBehaviorTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Calendario, rolagem ou recursos da interface falharam.' }
          & ./build/CatalogPhotoTests.exe build/catalog-test-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Produtos ou fotografias offline do catalogo falharam.' }
          $meta = Get-Content version.json -Raw | ConvertFrom-Json
          & ./build/IntegrationTests.exe release/latest.yml "release/PaoCaixa-Instalador-$($meta.version)-x86.exe" windows
          if ($LASTEXITCODE -ne 0) { throw 'Canal GitHub ou instalacao Windows falhou.' }

      - name: Guardar instalador e validação
        uses: actions/upload-artifact@v4
        with:
          name: PaoCaixa-${{ steps.source.outputs.version }}-validado
          path: source/pao-caixa-nativo/release/*
          if-no-files-found: error

      - name: Publicar release no GitHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.source.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'source/pao-caixa-nativo'
          $tag = "v$env:VERSAO"
          $existentes = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar releases existentes.' }
          if (@($existentes | Where-Object { $_.tagName -eq $tag }).Count -gt 0) { throw "A release $tag ja existe; nao sera sobrescrita." }
          $name = "PaoCaixa-Instalador-$env:VERSAO-x86.exe"
          & gh release create $tag "release/$name" 'release/latest.yml' 'release/SHA256.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Pao & Caixa $env:VERSAO" --notes "Instalador e atualizacao do Pao & Caixa $env:VERSAO." --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
