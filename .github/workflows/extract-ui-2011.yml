name: Preparar fontes do ajuste 2.0.11
on:
  push:
    branches: [fix/prefetch-and-paints-2011]
    paths: ['.github/workflows/extract-ui-2011.yml']
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair apenas os arquivos relevantes
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('PaoCaixa-2.0.10-Source.zip') as z:
           names=['src/MainForm.cs','src/PresentationPages.cs','src/Ui.cs','src/SettingsPage.cs','src/StartupPage.cs','src/VisualControls.cs','src/CanvasView.cs','src/SmoothScrolling.cs','tests/VisualBehaviorTests.cs']
           for name in names:
            entry='pao-caixa-nativo/'+name
            path=pathlib.Path('_stage2011')/entry
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_bytes(z.read(entry))
            print('EXTRACTED',entry,len(z.read(entry)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _stage2011
          git commit -m "chore: extrair fontes 2.0.10 para melhorias de carregamento e pintura"
          git push
