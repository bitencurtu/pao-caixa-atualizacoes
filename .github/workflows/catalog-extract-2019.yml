name: Prepare seed and image handling 2.0.19
on:
  push:
    branches: [feat/catalog-photos-2019]
    paths: ['.github/workflows/catalog-extract-2019.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract editable product catalog source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('PaoCaixa-2.0.18-Source.zip') as z:
           for item in z.namelist():
            if not item.startswith('pao-caixa-nativo/'):continue
            if item.endswith(('.cs','seed.json','installer.nsi','build.ps1','build.cmd','app.manifest')):
             p=pathlib.Path('_catalog2019')/item
             p.parent.mkdir(parents=True,exist_ok=True)
             p.write_bytes(z.read(item))
             print(item,len(z.read(item)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _catalog2019
          git commit -m 'chore: expose product catalog and UI handling for 2.0.19'
          git push
