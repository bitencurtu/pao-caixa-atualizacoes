name: Generate and validate bakery catalog 2.0.19
on:
  push:
    branches: [feat/catalog-photos-2019]
    paths: ['.github/workflows/catalog-build-2019.yml', '_catalog2019/pao-caixa-nativo/scripts/make-photos.py', '_catalog2019/pao-caixa-nativo/resources/photo-manifest.json']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        shell: bash
        run: python3 -m pip install --quiet --user Pillow
      - name: Fetch freely licensed images and generate offline atlas
        shell: bash
        run: |
          python3 _catalog2019/pao-caixa-nativo/scripts/make-photos.py
      - name: Verify all images and prepare source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json
          source=pathlib.Path('PaoCaixa-2.0.18-Source.zip')
          output=pathlib.Path('PaoCaixa-2.0.19-Source.zip')
          root=pathlib.Path('_catalog2019/pao-caixa-nativo')
          files={}
          for n in ['src/MainForm.cs','src/Models.cs','src/Store.cs','src/VisualControls.cs','src/ProductPhotos.cs','resources/seed.json','resources/catalog-extras.json','resources/catalog-photos.jpg','resources/FOTOS-LICENCAS.md','tests/CatalogPhotoTests.cs']:
           p=root/n
           files['pao-caixa-nativo/'+n]=p.read_bytes()
          seen=set()
          with zipfile.ZipFile(source) as previous,zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as dst:
           for info in previous.infolist():
            raw=previous.read(info.filename)
            if info.filename in files:
             raw=files[info.filename]
             seen.add(info.filename)
            if info.filename.endswith(('.cs','.json','.nsi','.config','.md','.xml','.mjs','.txt')):
             raw=raw.replace(b'2.0.18',b'2.0.19')
            dst.writestr(info,raw)
           for name,raw in files.items():
            if name not in seen:
             dst.writestr(name,raw)
          with zipfile.ZipFile(output) as z:
           data=json.loads(z.read('pao-caixa-nativo/resources/seed.json'))
           assert len(data['products'])==46
           extras=json.loads(z.read('pao-caixa-nativo/resources/catalog-extras.json'))
           assert len(extras)==30
           assert len(z.read('pao-caixa-nativo/resources/catalog-photos.jpg'))>20000
           assert len(z.read('pao-caixa-nativo/resources/FOTOS-LICENCAS.md').decode().split('\n'))>=46
           assert b'public const string Version="2.0.19"' in z.read('pao-caixa-nativo/src/Updates.cs')
           assert b'!define VERSION "2.0.19"' in z.read('pao-caixa-nativo/installer.nsi')
          print('CATALOG_SOURCE_READY',output,output.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PaoCaixa-2.0.19-Source.zip
          git rm -qr _catalog2019 .github/workflows/catalog-extract-2019.yml .github/workflows/catalog-photo-probe-2019.yml .github/workflows/catalog-build-2019.yml
          git commit -m 'feat: ship 30 optional products and 46 offline licensed photos'
          git push
