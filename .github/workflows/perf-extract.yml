name: Preparar diagnóstico de memória
on:
  push:
    branches: [perf/memory-baseline-209]
    paths: ['.github/workflows/perf-extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair C# para análise e medir tamanho do código
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('PaoCaixa-2.0.8-Source.zip') as z:
           names=[n for n in z.namelist() if n.endswith('.cs') and ('/src/' in n or '/tests/' in n)]
           for name in names:
            target=pathlib.Path('_perf_workbench')/name
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(z.read(name))
            print(name,len(z.read(name)))
          print('Total arquivos C#:',len(names))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _perf_workbench
          git commit -m 'chore: preparar fontes C# para perfilamento de memoria'
          git push
